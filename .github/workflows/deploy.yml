name: deploy — push-to-main → Cloud Run + post-deploy smoke

# Closes OT #91 (deploy-on-merge workflow; mc01-2026-05-30 sprint).
#
# n=2 prior drift instances of merged-but-not-deployed:
#   - mc07-2026-05-28 PR #13 (49 minutes drift before manual deploy)
#   - mc03-2026-05-29 PR #15 (~24+ hours drift; closed by this workflow)
#
# Lesson #35 anchor: README behavioural-recall ("Andrew runs make deploy after
# merging") drifted twice in 24h; binary-failure gate fires every push to main.
#
# Lesson #40 / SR #12 anchor: post-deploy `make smoke-prod` is the
# production-resolver-shape assertion against the freshly-deployed URL.
#
# Tri-state per Standing Rule #8:
#   exit 0 🟢 GREEN        — gcloud deploy succeeded + smoke-prod green
#   exit 1 🔴 LOGIC DRIFT  — deploy succeeded but smoke-prod red (consider
#                            rollback via gcloud run services update-traffic)
#   exit 2 🟡 INFRA BROKEN — gcloud deploy itself failed (auth / quota /
#                            source-build error); HALT and alert Andrew

on:
  push:
    branches:
      - main

# Workload Identity Federation (preferred over JSON service-account keys
# per GCP best practice + GitHub Actions OIDC integration).
permissions:
  contents: read       # checkout
  id-token: write      # OIDC token for WIF exchange

# Prevent overlapping deploys — if two PRs merge in rapid succession, the
# later run cancels any in-flight earlier run.
concurrency:
  group: deploy-main
  cancel-in-progress: false   # let in-flight finish; queue the next

jobs:
  deploy:
    name: deploy + smoke-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # WIF + service account configured per clawdog-brain
    # memory/2026-05-30-ot-91-sprint-design.md § 5 (GCP click-path).
    env:
      GCP_PROJECT: lodgeit-calc-constellation
      GCP_REGION: australia-southeast1
      SERVICE: fbt-calculator-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify auth + project
        run: |
          gcloud config set project "$GCP_PROJECT"
          gcloud config set run/region "$GCP_REGION"
          gcloud auth list
          gcloud config list

      # mc40-2026-08-29 Andrew follow-up 1: pre-deploy live-env-var-set delta
      # check. Reads the current live revision's env-var names and asserts
      # every one is present in deploy/env_vars.json. Catches the class of
      # failure "--set-env-vars declaration would silently drop names the
      # live service currently carries" — the exact blind spot Andrew
      # identified in the mc39.1 guard (a post-deploy assertion that reads
      # its expected set from the same document as the --set-env-vars
      # declaration is not mechanical; matched-drift passes both gates).
      #
      # The pre-deploy check reads the LIVE service, which is state
      # independent of any document in this repo, so matched-drift cannot
      # exist. If a name lives on the service that we're about to drop, this
      # step fails BEFORE the deploy fires — no wipe, no rollback needed.
      #
      # On first-ever deploy (no live revision yet), gcloud run services
      # describe exits non-zero with `NotFound`; the step handles that
      # gracefully and passes (nothing to compare against).
      #
      # Bypass: CLAWDOG_ENVVAR_SET_GUARD_DISABLE=1 skips this check but
      # emits a loud ::warning:: annotation per Andrew follow-up 2 — a
      # binary-failure gate with a silent bypass is not binary.
      - name: Pre-deploy live env-var-set delta check
        id: pre_deploy_envvar_check
        run: |
          set -o pipefail
          if [ "${CLAWDOG_ENVVAR_SET_GUARD_DISABLE:-0}" = "1" ]; then
            echo "::warning title=🚨 env-var-set guard BYPASSED::CLAWDOG_ENVVAR_SET_GUARD_DISABLE=1 is set; pre-deploy live env-var-set delta check SKIPPED. A silent bypass on a binary-failure gate is not binary — the workflow logs this loudly per mc40-2026-08-29 Andrew follow-up 2 so any bypass leaves a mechanical audit trail. Post-deploy assertion still fires."
            echo "🟡 BYPASSED (loud): pre-deploy live env-var-set delta check skipped by env-var flag; see workflow ::warning:: above."
            exit 0
          fi
          declared=$(python3 -c "import json; print('\n'.join(sorted(json.load(open('deploy/env_vars.json'))['env'].keys())))")
          live=$(gcloud run services describe "$SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --format='value(spec.template.spec.containers[0].env[].name)' \
            2>/dev/null | tr ';' '\n' | sort -u | grep -v '^$' || echo "")
          if [ -z "$live" ]; then
            echo "🟢 First-ever deploy or service not found; no live env-vars to compare. Proceeding."
            exit 0
          fi
          would_drop=()
          while IFS= read -r name; do
            if [ -n "$name" ] && ! grep -q -x "$name" <<<"$declared"; then
              would_drop+=("$name")
            fi
          done <<< "$live"
          if [ ${#would_drop[@]} -gt 0 ]; then
            echo "::error title=🔴 pre-deploy env-var-set delta check FAILED::deploy would DROP live env-var(s): ${would_drop[*]}. Root cause: --set-env-vars REPLACES the entire env-var set; deploy/env_vars.json does not declare the above name(s) but the live service currently carries them. Fix: add the missing name(s) to deploy/env_vars.json before this deploy fires."
            echo ""
            echo "Declared in deploy/env_vars.json:"
            echo "$declared" | sed 's/^/  /'
            echo ""
            echo "Live on service:"
            echo "$live" | sed 's/^/  /'
            echo ""
            echo "Would-be-dropped by this deploy:"
            printf '  %s\n' "${would_drop[@]}"
            exit 1
          fi
          echo "🟢 PASS: live env-var-set is a subset of declared set; no names would be dropped by this deploy."

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -o pipefail
          # mc39-2026-08-29 rung 5.5 (Fable verdict amendment 2 §A2.8 folded
          # rung 5.5) + mc39.1-2026-08-29 block-clear correction + mc40-
          # 2026-08-29 Andrew follow-up 1: declarative env-vars at deploy
          # time, sourced from deploy/env_vars.json as the ONE canonical
          # manifest. Prior state was `gcloud run deploy --source .` with
          # all engine URL env-vars set out-of-band via `gcloud run
          # services update --set-env-vars=...`; any deploy that dropped
          # them would silently break Andrew-a (mc37 Fable brief §5 layer 4
          # latent bomb).
          #
          # `--set-env-vars` REPLACES the entire env-var set on the new
          # revision. The pre-deploy live-set delta check above catches any
          # would-be silent drop mechanically (matched-drift blind spot
          # per mc40 Andrew follow-up 1: cross-checking two documents that
          # can both be wrong the same way is not a guard).
          set_env_vars=$(python3 -c "import json; d = json.load(open('deploy/env_vars.json'))['env']; print('^|^' + '|'.join(f'{k}={v}' for k, v in d.items()))")
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="$set_env_vars" \
            --quiet 2>&1 | tee deploy.log
          echo "Deploy complete. New revision:"
          gcloud run revisions list \
            --service "$SERVICE" \
            --region "$GCP_REGION" \
            --limit 3 \
            --format='table(metadata.name,metadata.creationTimestamp.date(),status.conditions[0].status)'

      # mc39.1-2026-08-29 block-clear: post-deploy env-var-set presence
      # assertion. Reads deploy/env_vars.json for the expected set and
      # asserts each is present on the freshly-deployed revision. Defence-
      # in-depth alongside the mc40 pre-deploy check: pre-deploy catches
      # would-be silent drops BEFORE the wipe; post-deploy confirms the
      # deploy landed the set intended.
      - name: Post-deploy env-var-set presence assertion
        id: envvar_check
        run: |
          set -o pipefail
          mapfile -t expected < <(python3 -c "import json; print('\n'.join(sorted(json.load(open('deploy/env_vars.json'))['env'].keys())))")
          actual=$(gcloud run services describe "$SERVICE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT" \
            --format='value(spec.template.spec.containers[0].env[].name)' \
            | tr ';' '\n' | sort -u)
          missing=()
          for name in "${expected[@]}"; do
            if ! grep -q -x "$name" <<<"$actual"; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::🔴 env-var-set drift on freshly-deployed revision."
            echo "::error::Expected env-vars from deploy/env_vars.json missing."
            echo "::error::Missing: ${missing[*]}"
            echo ""
            echo "Actual env-vars present on live revision:"
            echo "$actual" | sed 's/^/  /'
            exit 1
          fi
          echo "🟢 PASS: all ${#expected[@]} expected env-vars present on live revision"
          echo "  ($(echo "${expected[*]}" | tr ' ' ','))"

      # Post-deploy smoke-prod is THE SR #12 gate firing at deploy boundary.
      # If this fails, the deploy succeeded but the live surface is broken;
      # next step surfaces the rollback option.
      - name: Set up Python (for smoke_prod.sh sidecar parsing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post-deploy smoke-prod
        id: smoke
        run: |
          chmod +x scripts/smoke_prod.sh
          make smoke-prod

      # mc05-2026-05-30 widening per mc04 dogfood-discovered gap:
      # the original single rollback-hint step was gated on smoke.outcome
      # == 'failure' but when DEPLOY step #6 fails (mc03 attempts 1+2 IAM
      # gap surface), smoke.outcome is 'skipped' not 'failure', so the
      # debug step also skipped. Two parallel steps:
      #   #9 on smoke failure  : print rollback hint + previous revisions
      #   #9b on deploy failure: print build-id chain + describe URL
      - name: On smoke-prod failure — print rollback hint
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::smoke-prod failed against the freshly-deployed revision."
          echo "::error::Consider rollback via:"
          echo "::error::  gcloud run services update-traffic $SERVICE \\"
          echo "::error::    --region $GCP_REGION \\"
          echo "::error::    --to-revisions=<previous-revision>=100"
          echo ""
          echo "Previous revisions:"
          gcloud run revisions list \
            --service "$SERVICE" \
            --region "$GCP_REGION" \
            --limit 5 \
            --format='table(metadata.name,metadata.creationTimestamp.date())' || true

      - name: On deploy failure — print Cloud Build debug surface
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::gcloud run deploy failed. The deploy step's own"
          echo "::error::stderr is in the previous step's log."
          echo "::error::Common causes (from mc04 OT #91 dogfood-banking):"
          echo "::error::  - PERMISSION_DENIED on artifactregistry.* -> SA needs roles/artifactregistry.writer"
          echo "::error::  - storage.buckets.get denied on run-sources-* -> SA needs roles/storage.admin"
          echo "::error::  - cloudbuild.* denied -> SA needs roles/cloudbuild.builds.editor"
          echo "::error::  - run.services.* denied -> SA needs roles/run.admin"
          echo "::error::Canonical 5-role bundle: Cloud Run Admin + Service Account User"
          echo "::error::                       + Cloud Build Editor + Artifact Registry Writer + Storage Admin"
          echo ""
          echo "Recent Cloud Build builds (if any reached the build stage):"
          gcloud builds list \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --limit 3 \
            --format='table(id,status,createTime,logUrl)' || true
          echo ""
          echo "Most recent build describe (full failure surface):"
          LATEST_BUILD=$(gcloud builds list \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --limit 1 \
            --format='value(id)' 2>/dev/null) || true
          if [ -n "$LATEST_BUILD" ]; then
            gcloud builds describe "$LATEST_BUILD" \
              --project "$GCP_PROJECT" \
              --region "$GCP_REGION" \
              --format='value(status,statusDetail,logUrl,failureInfo.detail)' || true
          else
            echo "(No Cloud Build records — failure was upstream of build, likely IAM/auth.)"
          fi
