name: CI — binary-failure gates

# CLAWDOG/110 §3 — every push and PR runs the four binary-failure gates that
# define the architectural contract for this repository:
#   1. test_manifest_fidelity     (Lesson #38 — byte-content discipline)
#   2. test_advisory_boundary     (Lesson #34 — disclaimer at every egress)
#   3. test_phase3a_e2e           (Lesson #37 — production-surface contract)
#   4. test_openapi_drift         (Lesson #35 — spec-vs-code drift)
#
# Lesson #29 (Kit CI hygiene) anchor: subagents do not run pytest locally
# (Phase 3a brief constraint). CI is the canonical execution surface for
# the gates; without CI, the gates are notional.

on:
  push:
    branches:
      - "master"
      - "main"
      - "clawdog/**"
  pull_request:
    branches:
      - "master"
      - "main"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + binary-failure gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Australian locale (Standing Rule #4)
        # Mirrors the production runtime image. Belt-and-braces — none of the
        # current binary-failure gates depend on locale, but Standing Rule #4
        # immutables travel with the build environment.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends locales
          sudo sed -i -e 's/# *en_AU.UTF-8 UTF-8/en_AU.UTF-8 UTF-8/' /etc/locale.gen
          sudo locale-gen en_AU.UTF-8
          sudo update-locale LANG=en_AU.UTF-8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check api tests

      - name: Binary-failure gate #5 — deploy placeholder + env-var-set completeness
        # mc39.1-2026-08-29 addition: `scripts/check_deploy_placeholders.py`
        # gates the class of failure "silent env-var replacement drops or
        # clobbers a working out-of-band override" — first fuse
        # (`services replace` with placeholder in deploy/*.yaml, mc16-2026-05-25
        # anchor); second fuse (`run deploy --set-env-vars` with partial name
        # list in .github/workflows/*.yml, mc39.1-2026-08-29 anchor).
        # Wired at CI (client-side pre-push hook already fires; CI is the
        # defence-in-depth surface per L#39 + L#42 mechanical-perimeter
        # discipline).
        run: |
          python scripts/check_deploy_placeholders.py

      - name: Binary-failure gate #4 — OpenAPI drift
        # The drift check is run BEFORE pytest so any spec drift surfaces with
        # a clear, named failure (rather than as the slowest pytest line).
        #
        # PY=python overrides the Makefile default of `.venv/bin/python`,
        # which doesn't exist in CI (actions/setup-python@v5 installs Python
        # globally rather than into a venv). See Makefile header.
        run: |
          make openapi-check PY=python

      - name: Binary-failure gates #1–#3 — pytest
        # test_manifest_fidelity   — Lesson #38 anchor
        # test_advisory_boundary   — Lesson #34 anchor
        # test_phase3a_e2e         — Lesson #37 anchor
        # test_openapi_drift       — Lesson #35 anchor (also in pytest, defence-in-depth)
        env:
          LANG: en_AU.UTF-8
          LC_ALL: en_AU.UTF-8
        run: |
          pytest tests/ -v

      # Fable mc19 2026-09-04 ruling: CI collected-count gate.
      #
      # "a green check is evidence that something passed, not evidence
      # of what ran. Add a step asserting collected >= N, floor bumped
      # with the suite, to both engine and gateway CI — same discipline
      # as smoke floor 22, no token scope, and it cannot be forgotten
      # because it fails the run rather than a separate check nobody
      # fires."
      #
      # Two-hour post-deploy stale-truncated-checkout defect (n=3 this
      # arc): the 32-second run on 89c6eba would have failed this. Bump
      # the floor when the suite grows meaningfully; this line is the
      # enforcement, not a comment.
      - name: Collected-test-count floor (Fable mc19 2026-09-04 gate)
        # Floor bump history:
        #   mc19 2026-09-04: FLOOR=190 (against suite of 214)
        #   mc00 2026-09-04: FLOOR=230 (against suite of 245 after D8a+D8b
        #                    mapper + boundary-guard tests). Fable mc00
        #                    05:21 UTC: "A floor 53 tests behind the suite
        #                    can't see a fifth of it going missing."
        #                    ~6% margin: catches a 5% loss (~12 tests) as
        #                    a failure while allowing a small cluster of
        #                    skips or a fixture-heavy file WIP-disabled.
        # Bump this floor whenever the suite grows by >=15 tests; the
        # comment history above is the audit trail.
        run: |
          COLLECTED=$(pytest --collect-only 2>&1 | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+' | head -1)
          COLLECTED=${COLLECTED:-0}
          FLOOR=230
          echo "collected=$COLLECTED floor=$FLOOR"
          if [ "$COLLECTED" -lt "$FLOOR" ]; then
            echo "::error::pytest collected only $COLLECTED tests; floor is $FLOOR. Either the suite shrank or CI ran against a stale checkout. Fable mc19 gate."
            exit 1
          fi
